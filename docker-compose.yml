version: "3.9"

networks:
  app-network:
    driver: bridge
  executor-network:
    driver: bridge
    internal: true  # No internet access for code execution

volumes:
  postgres-data:
  redis-data:
  grafana-data:
  prometheus-data:

services:
  # ============================================================
  # DATABASE
  # ============================================================
  postgres:
    image: postgres:16-alpine
    container_name: codeplatform-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: codeplatform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================
  # CACHE / QUEUE
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: codeplatform-redis
    restart: unless-stopped
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru --save 60 1
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================
  # BACKEND API
  # ============================================================
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: codeplatform-backend
    restart: unless-stopped
    env_file:
      - apps/backend/.env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/codeplatform
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
    ports:
      - "4000:4000"
    networks:
      - app-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    volumes:
      - ./logs/backend:/app/apps/backend/logs

  # ============================================================
  # WORKER (Code Execution)
  # ============================================================
  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    container_name: codeplatform-worker-1
    restart: unless-stopped
    env_file:
      - apps/worker/.env
    environment:
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/codeplatform
      BACKEND_URL: http://backend:4000
      WORKER_ID: worker-1
      WORKER_CONCURRENCY: "3"
      NODE_ENV: production
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp:/tmp
      - ./logs/worker:/app/apps/worker/logs
    networks:
      - app-network
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    privileged: false
    user: "0"  # Need root for Docker socket access

  # Second worker for scaling
  worker-2:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    container_name: codeplatform-worker-2
    restart: unless-stopped
    env_file:
      - apps/worker/.env
    environment:
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/codeplatform
      BACKEND_URL: http://backend:4000
      WORKER_ID: worker-2
      WORKER_CONCURRENCY: "3"
      NODE_ENV: production
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp:/tmp
      - ./logs/worker-2:/app/apps/worker/logs
    networks:
      - app-network
    depends_on:
      redis:
        condition: service_healthy
    user: "0"

  # ============================================================
  # FRONTEND
  # ============================================================
  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    container_name: codeplatform-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NEXT_PUBLIC_WS_URL: http://localhost:4000
      NODE_ENV: production
    ports:
      - "3000:3000"
    networks:
      - app-network
    depends_on:
      - backend

  # ============================================================
  # REVERSE PROXY
  # ============================================================
  nginx:
    image: nginx:alpine
    container_name: codeplatform-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - app-network
    depends_on:
      - backend
      - frontend
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================================
  # MONITORING: Prometheus
  # ============================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: codeplatform-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - app-network

  # ============================================================
  # MONITORING: Grafana
  # ============================================================
  grafana:
    image: grafana/grafana:latest
    container_name: codeplatform-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin123
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: http://localhost:3001
    ports:
      - "3001:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - app-network
    depends_on:
      - prometheus
